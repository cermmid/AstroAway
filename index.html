<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>AstroAway</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: #9fb8d0;
        font-size: 13px;
        line-height: 1.5;
        background: rgba(4, 10, 20, 0.55);
        border: 1px solid rgba(120, 170, 220, 0.25);
        border-radius: 8px;
        padding: 10px 14px;
        max-width: 340px;
        backdrop-filter: blur(4px);
        user-select: none;
      }
      #hud input {
        width: 70px;
        background: rgba(10, 25, 45, 0.8);
        border: 1px solid rgba(120, 170, 220, 0.35);
        color: #cfe3f5;
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 12px;
      }
      #hud button {
        background: rgba(30, 70, 110, 0.8);
        border: 1px solid rgba(120, 170, 220, 0.45);
        color: #dff0ff;
        border-radius: 4px;
        padding: 2px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      #hud .title {
        font-weight: 600;
        color: #dff0ff;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
